name: Keep backend awake + uptime check
# Render's free plan sleeps after about 15 idle minutes. GitHub may run this late at busy times.
# Uptime check (2026-11-17): a failed run means the site or API is down; GitHub emails the repo
# owner about failed scheduled runs, so this doubles as a free uptime alert.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Backend is up
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://productify-backend-65tj.onrender.com/health
      - name: API answers
        run: curl -fsS --retry 2 --retry-delay 15 --max-time 60 -o /dev/null https://productify-backend-65tj.onrender.com/api/rentals
      - name: Website is up
        run: curl -fsS --retry 2 --retry-delay 15 --max-time 30 -o /dev/null https://www.productifynow.com/
