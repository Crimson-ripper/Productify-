name: Keep backend awake
# Render's free plan sleeps after about 15 idle minutes. GitHub may run this late at busy times.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://productify-backend-65tj.onrender.com/health
