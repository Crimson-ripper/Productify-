name: Tests
# Runs on every push and pull request (2026-11-17): backend tests and the production front-end
# build (CI=true, so build warnings fail like they do on Vercel). A red check before a deploy
# means something broke or an old copy of a file overwrote newer code.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:1
      DB_NAME: productify_ci
      JWT_SECRET: ci-only-not-a-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # test_productify_api.py calls a running server, so it isn't part of CI.
      - run: python -m pytest -q -n0 tests/ --ignore=tests/test_productify_api.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: npx craco build
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: https://productify-backend-65tj.onrender.com
