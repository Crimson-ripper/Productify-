name: Build Vast images
# Builds Productify's Vast images into GitHub's registry (ghcr.io). Rebuilt on changes and monthly for security updates.
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [ai-dev, render]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the base images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/crimson-ripper/productify-${{ matrix.image }}:latest
            ghcr.io/crimson-ripper/productify-${{ matrix.image }}:${{ github.sha }}
