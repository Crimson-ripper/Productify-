<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#101112" />
        <!-- Per-page title, description, canonical and og/twitter tags come from components/SEO.jsx
             (pre-rendered into the HTML at build time by scripts/prerender.mjs). Don't add them here. -->
        <title>Productify</title>
        <meta name="robots" content="index, follow" />

        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
        <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.json" />

        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": "https://www.productifynow.com/#org",
              "name": "Productify",
              "alternateName": ["Productify Now", "productifynow"],
              "url": "https://www.productifynow.com/",
              "logo": { "@type": "ImageObject", "url": "https://www.productifynow.com/icon-512.png", "width": 512, "height": 512 },
              "email": "support@productifynow.com"
            },
            {
              "@type": "WebSite",
              "@id": "https://www.productifynow.com/#site",
              "name": "Productify",
              "alternateName": "productifynow.com",
              "url": "https://www.productifynow.com/",
              "publisher": { "@id": "https://www.productifynow.com/#org" }
            }
          ]
        }
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
